# ============================================================================
# WORKFLOWS - SCHEDULE ALL JOBS
# ============================================================================

workflows:
  # Every 30 minutes - Critical files
  schedule-every-30min:
    triggers:
      - schedule:
          cron: "*/30 * * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - update-jtvplus
      - update-jtvplus2

  # Every hour - Star files
  schedule-every-1hour:
    triggers:
      - schedule:
          cron: "0 * * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - update-star
      - update-star2
      - update-star3
      - update-tnt
      - update-hotstar

  # Every 2 hours - JTV & Specialty files
  schedule-every-1hours:
    triggers:
      - schedule:
          cron: "0 */1 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - update-jtv
      - update-jtv2
      - update-jtv3
      - update-mixiptv
      - update-playlist

  # Every 1 hours - Additional JTV Plus files
  schedule-every-4hours:
