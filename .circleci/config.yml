version: 2.1

# ============================================================================
# ORBS & DEFINITIONS
# ============================================================================

# Reusable commands
commands:
  setup-git:
    description: "Configure Git user and timezone"
    steps:
      - run:
          name: Configure Git User
          command: |
            git config --global user.name "sportlive18"
            git config --global user.email "271363488+sportlive18@users.noreply.github.com"
      - run:
          name: Set Timezone to IST
          command: |
            export TZ="Asia/Kolkata"
            echo "TZ=Asia/Kolkata" >> $BASH_ENV

  sync-repo:
    description: "Sync repository with main branch"
    steps:
      - run:
          name: Sync Repository
          command: |
            git pull origin main --rebase --autostash || true

  check-and-commit:
    description: "Check for changes and commit if needed"
    parameters:
      file:
        type: string
        description: "File to check"
    steps:
      - run:
          name: Check for Changes in << parameters.file >>
          command: |
            git add << parameters.file >>
            
            if git diff --cached --quiet; then
              echo "⏭️  No changes in << parameters.file >>"
              git reset HEAD << parameters.file >>
            else
              echo "✏️  Changes detected in << parameters.file >>"
              git commit -m "Updated << parameters.file >> ✅ [$(date +'%d-%m-%Y %H:%M')]"
            fi
      - run:
          name: Push Changes
          command: |
            git pull origin main --rebase --autostash || true
            git push origin main || git push origin main --force-with-lease || true

  verify-file:
    description: "Verify file exists and show info"
    parameters:
      file:
        type: string
        description: "File to verify"
    steps:
      - run:
          name: Verify << parameters.file >>
          command: |
            if [ -f << parameters.file >> ]; then
              echo "✅ File << parameters.file >> exists"
              ls -lh << parameters.file >>
              head -3 << parameters.file >>
            else
              echo "❌ File << parameters.file >> NOT found"
            fi

