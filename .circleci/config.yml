      - update-jtvplus2
      - update-jtvplus3
      - update-jtvplus4
      - update-jtvplus5
      - update-jtvplus6
      - update-jtvplus7
      - update-jtvplus8
      - update-mixiptv
      - update-playlist
      - update-pocket
